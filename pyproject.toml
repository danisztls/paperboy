[project]
name = "paperboy"
version = "0.1.0"
description = "Scheduled personal notifier: feeds, listings, weather, finance and research delivered to Discord"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9,<3.14",  # aioresponses 0.7.9 (latest) breaks on 3.14: ClientResponse.stream_writer
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.12",
    "openai>=2.33.0",  # OpenAI-compatible client used by the DeepSeek adapter
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "google-genai>=2.2.0",
    "rich>=13.0",
    "yfinance>=0.2.40",
]

[project.scripts]
paperboy = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
