[project]
name = "claudinho"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.12",
    "instructor>=1.6",
    "openai>=2.33.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "yt-dlp>=2024.0",
    "playwright>=1.40",
    "trafilatura>=1.12",
    "anthropic>=0.101.0",
    "google-genai>=2.2.0",
    "rich>=13.0",
    "camoufox>=0.4.11",
]

[project.scripts]
claudinho = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aioresponses>=0.7.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
