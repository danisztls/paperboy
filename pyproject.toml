[project]
name = "claudinho"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.12",
    "openai>=2.33.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "Pillow>=11.0",
    "yt-dlp>=2024.0",
    "playwright>=1.40",
    "trafilatura>=1.12",
    "anthropic>=0.101.0",
]

[project.scripts]
claudinho = "main:main"

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
